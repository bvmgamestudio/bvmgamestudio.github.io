<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BvM Studio</title>
<meta name="description" content="BvM Studio makes casual mobile games. Home of Shrink & Score.">
<style>
  :root { --bg: #ffffff; --fg: #1d2330; --muted: #5b6475; --accent: #3a7bff; --line: #e3e7ef; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0f16; --fg: #e8ecf3; --muted: #9aa3b5; --accent: #6b9dff; --line: #262c38; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 2rem; margin: 0 0 4px; }
  h2 { font-size: 1.2rem; margin: 36px 0 8px; }
  p, li { color: var(--fg); }
  .muted { color: var(--muted); }
  a { color: var(--accent); }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; }
  ul { padding-left: 20px; }
</style>
</head>
<body>
<main>
<h1>BvM Studio</h1>
<p class="muted">Casual mobile games.</p>

<h2>Games</h2>
<div class="card">
  <strong>Shrink &amp; Score</strong>
  <p>Hold to shrink, let go to grow. Squeeze through the gaps and stay big to score more.</p>
  <ul>
    <li><a href="https://play.google.com/store/apps/details?id=com.shrinkandscore.game">Google Play</a></li>
    <li><a href="https://apps.apple.com/app/id6826530983">App Store</a></li>
    <li><a href="https://bvmgamestudio.github.io/shrink-and-score-privacy/">Privacy policy / Gizlilik politikası</a></li>
  </ul>
</div>

<h2>Contact</h2>
<p><a href="mailto:bvmgamestudio@gmail.com">bvmgamestudio@gmail.com</a></p>
</main>
</body>
</html>
